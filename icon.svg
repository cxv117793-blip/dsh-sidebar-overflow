<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sidebar Overflow">
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#2f6feb" opacity="0.12"/>
  <g fill="#2f6feb">
    <!-- 侧边栏轨道 -->
    <rect x="15" y="17" width="6" height="30" rx="3"/>
    <!-- 留在主列表的两个条目 -->
    <rect x="26" y="17" width="17" height="6" rx="3"/>
    <rect x="26" y="28" width="17" height="6" rx="3"/>
    <!-- 收进「更多」的三个点 -->
    <circle cx="31" cy="43.5" r="2.6"/>
    <circle cx="38.5" cy="43.5" r="2.6"/>
    <circle cx="46" cy="43.5" r="2.6"/>
  </g>
</svg>
